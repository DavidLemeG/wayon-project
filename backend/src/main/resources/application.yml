spring:
  application:
    name: transferscheduling

  datasource:
    url: jdbc:h2:mem:transferscheduling;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  jackson:
    time-zone: America/Sao_Paulo

  mvc:
    # Faz o Spring lancar NoHandlerFoundException em rota inexistente, em vez de
    # delegar para a pagina de erro padrao. Assim o 404 tambem sai no formato
    # ApiError (com "message"), mantendo o contrato unico de erro da ADR 0006 —
    # antes o 404 vinha sem "message" e o front recebia undefined.
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # Necessario junto do acima: com o handler de recursos estaticos ativo, ele
      # atende qualquer rota nao mapeada e a excecao nunca chega a ser lancada.
      # Esta API nao serve conteudo estatico (o front e uma aplicacao separada).
      add-mappings: false

server:
  port: 8080

logging:
  # Sem isso o log sai com acento corrompido ("n?o pode", "d?gitos") em
  # ambiente cujo charset default nao e UTF-8 (Windows/Cp1252, por exemplo):
  # as mensagens sao em portugues, o encoder precisa acompanhar.
  charset:
    console: UTF-8
  level:
    # Log de negocio da aplicacao (requisicao recebida, taxa calculada,
    # agendamento criado, rejeicoes). Numeros de conta saem mascarados —
    # ver AccountMasker e ADR 0011.
    com.wayon.transferscheduling: INFO
    # Para inspecionar o SQL gerado durante o desenvolvimento, suba com:
    # --logging.level.org.hibernate.SQL=DEBUG
    org.hibernate.SQL: INFO

app:
  # Padroes de origem autorizados a chamar a API pelo navegador. Qualquer
  # porta em localhost (5173 e a padrao do dev server do Vite, mas o Vite
  # incrementa a porta se 5173 ja estiver em uso) - continua restrito a
  # localhost, nao abre para a internet. Ver CorsConfig.
  cors:
    allowed-origin-patterns: http://localhost:*
  scheduling:
    # Fuso usado para determinar "hoje" ao registrar a data de agendamento.
    time-zone: America/Sao_Paulo
