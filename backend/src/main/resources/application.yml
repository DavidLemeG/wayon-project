spring:
  application:
    name: transferscheduling

  datasource:
    url: jdbc:h2:mem:transferscheduling;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  jackson:
    time-zone: America/Sao_Paulo

server:
  port: 8080

app:
  # Origens autorizadas a chamar a API pelo navegador. 5173 e a porta padrao do
  # dev server do Vite (front-end Vue); 4173 e a do "vite preview" (build local).
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173
  scheduling:
    # Fuso usado para determinar "hoje" ao registrar a data de agendamento.
    time-zone: America/Sao_Paulo
