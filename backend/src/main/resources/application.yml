spring:
  application:
    name: transferscheduling

  datasource:
    url: jdbc:h2:mem:transferscheduling;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  jackson:
    time-zone: America/Sao_Paulo

server:
  port: 8080
